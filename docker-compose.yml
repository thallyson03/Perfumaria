services:
  postgres:
    image: postgres:16-alpine
    container_name: revendedor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revendedor
      POSTGRES_PASSWORD: revendedor
      POSTGRES_DB: revendedor
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revendedor -d revendedor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: revendedor-redis
    restart: unless-stopped
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
