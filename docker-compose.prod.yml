# Produção — Coolify (Docker Compose)
# Domínios na UI: api→3001, admin→3000, storefront→3002
# Marque também "Connect To Predefined Network" no Coolify.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revendedor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-revendedor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--notify-keyspace-events", "Ex", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      UPLOAD_DIR: /app/uploads
      ROOT_DOMAIN: ${ROOT_DOMAIN:?defina ROOT_DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-revendedor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-revendedor}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD}
      CART_RESERVE_TTL_SECONDS: ${CART_RESERVE_TTL_SECONDS:-900}
      ORDER_WHATSAPP_TTL_SECONDS: ${ORDER_WHATSAPP_TTL_SECONDS:-3600}
      ORDER_PAYMENT_TTL_SECONDS: ${ORDER_PAYMENT_TTL_SECONDS:-1800}
      N8N_ALERTS_WEBHOOK_URL: ${N8N_ALERTS_WEBHOOK_URL:-}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "3001"
    networks:
      - internal
      - coolify

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      - internal
      - coolify

  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_ROOT_DOMAIN: ${ROOT_DOMAIN:?defina ROOT_DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3002
      HOSTNAME: 0.0.0.0
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      NEXT_PUBLIC_ROOT_DOMAIN: ${ROOT_DOMAIN}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    expose:
      - "3002"
    networks:
      - internal
      - coolify

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  internal:
    driver: bridge
  coolify:
    external: true
